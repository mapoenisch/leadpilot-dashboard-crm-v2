# CI-Auftrag Codex-Nacharbeit: Rückfallebene für den Codex-Review.
# Codex prüft Team-PRs bei jedem Push von sich aus. Dieser Workflow fordert nur nach,
# wenn 20 Minuten nach dem Head-Commit weder Review noch Reaktion von Codex vorliegt,
# oder sofort, wenn Marc das Label `codex-review` setzt. Je Head-SHA höchstens einmal.
name: Codex Review Request

on:
  schedule:
    - cron: '*/15 * * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR-Nummer (leer = alle offenen PRs)'
        required: false

permissions:
  contents: read

concurrency:
  group: codex-review-request
  cancel-in-progress: false

jobs:
  request:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'codex-review' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Die Logik kommt immer vom Default-Branch, nie aus dem PR-Checkout (Job hat Schreibrecht).
      - name: Entscheidungslogik vom Default-Branch laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .cycle-tools
          sparse-checkout: scripts/codexReviewCycle.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
      - name: Codex-Review je Head-SHA höchstens einmal anfordern
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FROM_LABEL: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ github.event.inputs.pr }}
        run: |
          tool=.cycle-tools/scripts/codexReviewCycle.mjs
          if [ ! -f "$tool" ]; then
            echo "Review-Zyklus ist noch nicht auf dem Default-Branch: übersprungen."
            exit 0
          fi
          if [ -n "$PR_FROM_LABEL" ]; then
            node "$tool" request --pr="$PR_FROM_LABEL" --force
          elif [ -n "$PR_FROM_INPUT" ]; then
            case "$PR_FROM_INPUT" in *[!0-9]*) echo "PR-Nummer muss numerisch sein"; exit 1 ;; esac
            node "$tool" request --pr="$PR_FROM_INPUT"
          else
            node "$tool" request
          fi
