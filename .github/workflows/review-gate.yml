# Review-Gate für das gesamte Repo (alle PRs): setzt die Commit-Status `agent-review` ("Reviewed" durch
# Codex/Antigravity/OpenCode/Devin, siehe .github/review-agents.json) und `review-conversations`
# (failure, solange Review-Konversationen offen sind). Skript und Prüferliste kommen immer vom
# Default-Branch; PR-Code wird nie ausgecheckt.
#
# Fälschungsschutz: Die Status setzt die eigene GitHub-App (Secrets nur in der Umgebung `review-gate`,
# Deployment-Branch-Regel: nur Default-Branch). Alle Auslöser hier laufen im Kontext des Default-Branches.
# Review-Ereignisse (Workflow-Stand aus dem PR) gehen deshalb über `review-gate-trigger.yml` und
# `workflow_run`. Im Branch-Schutz die Pflicht-Checks an die Review-Gate-App heften.
name: Review Gate

on:
  # `edited` erfasst einen Zielbranch-Wechsel (frühere Reviews verlieren dann ihre Gültigkeit).
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Geschützte periodische Neubewertung: `review-gate-trigger.yml` läuft mit dem Workflow-Stand aus dem
  # PR und kann dort entschärft werden (z. B. `dismissed` entfernt). Spätestens dieser Lauf korrigiert es.
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: [Review Gate Trigger]
    types: [completed]
  # Ändern sich Skript oder Prüferliste auf dem Default-Branch, werden alle offenen PRs neu bewertet,
  # damit kein veralteter `agent-review=success` stehen bleibt.
  push:
    branches: [main]
    paths:
      - scripts/reviewGate.mjs
      - .github/review-agents.json
  # Das Lösen einer Konversation löst keinen Workflow aus. Danach manuell: Actions > Review Gate > Run workflow.
  workflow_dispatch:

permissions:
  contents: read

# Eine Gruppe für das ganze Repo, und jeder Lauf bewertet alle offenen PRs mit frischen Daten: Der
# zuletzt gestartete Lauf schreibt damit immer den aktuellen Stand, kein älterer Snapshot überholt ihn.
concurrency:
  group: review-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: review-gate
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skript vom Default-Branch laden
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/reviewGate.mjs
            .github/review-agents.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
      - name: Status setzen
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_GATE_APP_ID: ${{ secrets.REVIEW_GATE_APP_ID }}
          REVIEW_GATE_APP_KEY: ${{ secrets.REVIEW_GATE_APP_KEY }}
        run: node scripts/reviewGate.mjs --pr=all
