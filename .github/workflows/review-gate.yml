# Review-Gate für das gesamte Repo (alle PRs): setzt die Commit-Status `agent-review` ("Reviewed" durch
# Antigravity/OpenCode/Devin, siehe .github/review-agents.json) und `review-conversations`
# (failure, solange Review-Konversationen offen sind). Skript und Prüferliste kommen immer vom
# Default-Branch; PR-Code wird nie ausgecheckt. Der Job darf nur Status schreiben.
name: Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, deleted]
  # Das Lösen einer Konversation löst keinen Workflow aus (`pull_request_review_thread` ist kein
  # Actions-Ereignis). Nach dem Lösen den Status manuell aktualisieren: Actions > Review Gate > Run workflow.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR-Nummer'
        required: true

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Skript vom Default-Branch laden
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/reviewGate.mjs
            .github/review-agents.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
      - name: Status setzen
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "PR-Nummer fehlt oder ist nicht numerisch"; exit 1 ;; esac
          node scripts/reviewGate.mjs --pr="$PR"
