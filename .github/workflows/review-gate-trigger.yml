# Auslöser für das Review-Gate bei Review-Ereignissen. Diese Ereignisse laufen mit dem Workflow-Stand
# aus dem PR und bekommen deshalb weder Secrets noch Schreibrechte. Der Lauf meldet nur „etwas hat sich
# geändert“; den Status setzt `review-gate.yml` per `workflow_run` vom Default-Branch.
name: Review Gate Trigger

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, deleted]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Review-Ereignis – Review Gate folgt per workflow_run"
