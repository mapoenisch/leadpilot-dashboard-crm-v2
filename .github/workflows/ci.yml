# Gate G58 (Auftrag 067L): CI-Pipeline. Fail-closed, SHA-Pinning aller externen
# Actions, vollständige E2E-, A11y- und Readiness-Prüfung bei PR und main.
# Baselines: Fehler/Warnungen stehen hart auf 0. Restschulden, die ESLint nicht
# meldet (eslint-disable-Ausnahmen, Inline-Styles außerhalb der Regel-Scopes),
# führt docs/quality/debt-budget.json als Ratsche (Issue #7, docs/quality/DEBT_BUDGET.md).
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  LINT_BASELINE: 0
  MAX_LINES_BASELINE: 0
  TSC_BASELINE: 0
  INLINE_STYLE_BASELINE: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: ESLint (Baseline-Ratsche)
        run: |
          npx eslint . -f json -o eslint-report.json || true
          test -s eslint-report.json
          read -r COUNT MAX_LINES INLINE_STYLE < <(node -e '
            const r = JSON.parse(require("fs").readFileSync("eslint-report.json", "utf8"));
            const msgs = r.flatMap((f) => f.messages);
            const total = r.reduce((s, f) => s + f.errorCount + f.warningCount, 0);
            const rule = (id) => msgs.filter((m) => m.ruleId === id).length;
            console.log(total, rule("max-lines"), rule("react/forbid-dom-props") + rule("react/forbid-component-props"));
          ')
          echo "ESLint errors+warnings: $COUNT (baseline $LINT_BASELINE)"
          echo "max-lines: $MAX_LINES (baseline $MAX_LINES_BASELINE)"
          echo "Inline-Style-Verstöße: $INLINE_STYLE (baseline $INLINE_STYLE_BASELINE)"
          [ "$COUNT" -le "$LINT_BASELINE" ] || { echo "::error::ESLint-Regression $COUNT > $LINT_BASELINE"; exit 1; }
          [ "$MAX_LINES" -le "$MAX_LINES_BASELINE" ] || { echo "::error::max-lines-Regression $MAX_LINES > $MAX_LINES_BASELINE"; exit 1; }
          [ "$INLINE_STYLE" -le "$INLINE_STYLE_BASELINE" ] || { echo "::error::Inline-Style-Regression $INLINE_STYLE > $INLINE_STYLE_BASELINE"; exit 1; }
      - name: Quality-Debt-Budget (Suppressions + Inline-Styles, Ratsche)
        run: npm run verify:quality-budget

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: TypeScript (Baseline-Ratsche)
        run: |
          COUNT=$(npx tsc --noEmit 2>&1 | grep -c "error TS" || true)
          echo "TSC errors: $COUNT (baseline $TSC_BASELINE)"
          [ "$COUNT" -le "$TSC_BASELINE" ] || { echo "::error::TSC-Regression $COUNT > $TSC_BASELINE"; exit 1; }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
      - name: Deno Edge Functions typecheck
        run: deno check --config supabase/functions/deno.json --lock supabase/functions/deno.lock --frozen-lockfile --node-modules-dir=none supabase/functions/*/index.ts
      - name: Deno Edge Functions tests
        run: deno test --config supabase/functions/deno.json --lock supabase/functions/deno.lock --frozen-lockfile --node-modules-dir=none --allow-env --allow-net --allow-read supabase/functions/
      - name: Vitest mit Coverage
        run: npm run test:coverage
      - name: Legacy-Harness (Parallelbetrieb bis Schritt d)
        run: npm run verify
      - name: Dependency Audit Check
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high
      - name: Migration Integrity Check
        run: |
          test -d supabase/migrations
          test $(ls supabase/migrations/*.sql 2>/dev/null | wc -l) -gt 0
      - name: Coverage-Bericht als Artefakt
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage
          path: coverage/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run build

  livekpi-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/verifyLiveKpiCatalog.ts
      - run: npx tsx scripts/verifyLivePerformanceSurface.ts

  size-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: npx size-limit

  e2e:
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0
      - name: Lokales Supabase-Backend mit deterministischem Seed initialisieren
        run: |
          cp supabase/schema.sql supabase/migrations/20260101000000_base_schema.sql
          # `supabase start` startet nur Container; der Seed wird erst mit `db reset`
          # zuverlässig auf die frische lokale DB angewendet. Ohne diesen Reset sind
          # auth.users / organization_members leer und der Login-Setup bricht ab.
          supabase start -x studio,imgproxy,storage-api,logflare,vector,supavisor,mailpit,postgres-meta
          supabase db reset --yes
          eval $(supabase status -o env)
          echo "VITE_SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "E2E_SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
          echo "E2E_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "E2E_CLEANUP_KEY=${SERVICE_ROLE_KEY}" >> $GITHUB_ENV
          echo "E2E_AUTH_EMAIL=admin-a@e2e.local" >> $GITHUB_ENV
          echo "E2E_AUTH_PASSWORD=TestPassword123!" >> $GITHUB_ENV
          echo "E2E_AUTH_EMAIL_B=admin-b@e2e.local" >> $GITHUB_ENV
          echo "E2E_AUTH_PASSWORD_B=TestPassword123!" >> $GITHUB_ENV
          echo "E2E_AUTH_EMAIL_NOMEMBER=nomember@e2e.local" >> $GITHUB_ENV
          echo "E2E_AUTH_EMAIL_MANAGER=manager-a@e2e.local" >> $GITHUB_ENV
          echo "E2E_AUTH_EMAIL_VIEWER=viewer-a@e2e.local" >> $GITHUB_ENV
      - name: pgTAP-Datenbanktests (supabase test db)
        run: supabase test db
      - name: Playwright-Browser cachen
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1243
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - name: Build für E2E und Lighthouse
        run: npx vite build
      - name: Playwright E2E & Axe Accessibility Tests
        run: npx playwright test e2e/a11y.spec.ts e2e/auth.spec.ts e2e/crm-query-export.spec.ts e2e/element-clipping.acceptance.ts e2e/resources-viewer.spec.ts e2e/routes.spec.ts e2e/semantic-routes.spec.ts e2e/tenant-isolation.spec.ts e2e/visual.spec.ts
      - name: Playwright Simulation & Worker Tests (sequentiell)
        run: npx playwright test e2e/persistence-multisession.spec.ts e2e/worker-responsiveness.spec.ts --workers=1
      - name: Playwright-Chrome für Lighthouse bereitstellen
        run: |
          CHROME_PATH="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          test -x "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Lighthouse CI
        run: npx lhci autorun
      - name: Coverage aus test-Job laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
          path: coverage/
      - name: Coverage-Artefakt für Readiness prüfen
        run: test -s coverage/coverage-summary.json
      - name: ReleaseReadiness Orchestrator (Fail-Closed)
        run: npx tsx scripts/verifyV23ReleaseReadiness.ts
      - name: Lokales Supabase-Backend stoppen
        if: always()
        run: supabase stop
      - name: Playwright-Report als Artefakt
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Lighthouse-Report als Artefakt
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
