# Erzeugt die Playwright-Visual-Baselines in derselben ubuntu-latest-Umgebung,
# in der ci.yml sie später prueft. Laeuft nur auf Branches unter
# visual-baselines/** — nicht auf main, nicht bei PRs.
#
# Ablauf: Branch anlegen, pushen, Artefakt "visual-baselines" herunterladen,
# Bilder sichtpruefen, in den Branch committen, PR oeffnen.
#
# Kein workflow_dispatch: das wuerde die Datei auf dem Default-Branch
# voraussetzen. Der Push-Trigger kommt ohne diese Bedingung aus.
name: Update Visual Baselines

on:
  push:
    branches:
      - 'visual-baselines/**'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0
      - name: Lokales Supabase-Backend starten und initialisieren
        run: |
          cp supabase/schema.sql supabase/migrations/20260101000000_base_schema.sql
          supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
          eval $(supabase status -o env)
          echo "VITE_SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "E2E_SUPABASE_URL=${API_URL}" >> $GITHUB_ENV
          echo "E2E_SUPABASE_ANON_KEY=${ANON_KEY}" >> $GITHUB_ENV
          echo "E2E_AUTH_EMAIL=admin-a@e2e.local" >> $GITHUB_ENV
          echo "E2E_AUTH_PASSWORD=TestPassword123!" >> $GITHUB_ENV
          echo "E2E_AUTH_EMAIL_B=admin-b@e2e.local" >> $GITHUB_ENV
          echo "E2E_AUTH_PASSWORD_B=TestPassword123!" >> $GITHUB_ENV
          echo "E2E_AUTH_EMAIL_NOMEMBER=nomember@e2e.local" >> $GITHUB_ENV
      - name: Playwright-Browser cachen
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1243
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Baselines neu erzeugen
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: Lokales Supabase-Backend stoppen
        if: always()
        run: supabase stop
      - name: Neue Baselines als Artefakt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots/
          retention-days: 7
      - name: Report als Artefakt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regen-report
          path: playwright-report/
          retention-days: 7
