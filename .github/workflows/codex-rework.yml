# CI-Auftrag Codex-Nacharbeit: Ein Ergebnis des verifizierten Codex-Bots (ganzer Review
# oder Ergebnis-Kommentar) startet eine gesammelte Nacharbeitsrunde durch Claude auf
# demselben PR-Branch. Höchstens drei Runden pro PR, danach Hinweis an Marc.
# Kein Merge, keine Freigabe. Entscheidungslogik: scripts/codexReviewCycle.mjs, immer vom
# Default-Branch geladen, nie aus dem PR.
#
# Rechtetrennung: Nur der Job `rework` führt PR-Code aus (npm ci, Gates, Claude). Er hat
# ausschließlich Leserechte und keine gespeicherten Zugangsdaten. Claude committet dort nur lokal.
# Der Job `publish` führt keinen PR-Code aus, prüft das Ergebnis (Fast-Forward, keine
# Schutzbereiche, keine Workflows) und pusht erst danach.
name: Codex Rework

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read

# Ein Lauf pro PR; ein weiteres Ergebnis wartet, statt parallel denselben Branch zu bearbeiten.
concurrency:
  group: codex-rework-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.review.user.id == 199175422 &&
       github.event.review.user.type == 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.comment.user.id == 199175422 &&
       github.event.comment.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      action: ${{ steps.gate.outputs.action }}
      round: ${{ steps.gate.outputs.round }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      pr: ${{ steps.gate.outputs.pr }}
    steps:
      - name: Entscheidungslogik vom Default-Branch laden
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .cycle-tools
          sparse-checkout: scripts/codexReviewCycle.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0

      - name: Ergebnis prüfen (Bot, Head-SHA, Dopplung, Rundenlimit)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          if [ ! -f .cycle-tools/scripts/codexReviewCycle.mjs ]; then
            echo "Review-Zyklus ist noch nicht auf dem Default-Branch: übersprungen."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$REVIEW_ID" ]; then source="--review=$REVIEW_ID"; else source="--comment=$COMMENT_ID"; fi
          node .cycle-tools/scripts/codexReviewCycle.mjs rework-gate --pr="$PR" "$source" \
            --findings="$RUNNER_TEMP/findings/findings.md"

      - name: Befunde weitergeben
        if: steps.gate.outputs.action == 'rework'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: codex-findings
          path: ${{ runner.temp }}/findings/findings.md
          retention-days: 7

  rework:
    needs: gate
    if: needs.gate.outputs.action == 'rework'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Führt PR-Code aus, deshalb nur Leserechte; kein id-token, also kein App-Token für Claude.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: PR-Branch ohne gespeicherte Zugangsdaten auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Befunde bereitlegen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-findings
          path: .codex-review-cycle

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0

      - name: Abhängigkeiten ohne Lifecycle-Skripte installieren
        run: |
          printf '%s\n' .codex-review-cycle >> .git/info/exclude
          npm ci --ignore-scripts

      - name: Codex-Befunde gesammelt nacharbeiten
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lese-Token statt App-Token: Claude kann weder pushen noch kommentieren.
          github_token: ${{ github.token }}
          allowed_bots: chatgpt-codex-connector
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(npx tsc --noEmit),Bash(npm run lint),Bash(npm test),Bash(npm run verify),Bash(npm run build),Bash(npm run format:check),Bash(npx prettier --write:*),Bash(gh pr view:*)"
            --disallowedTools "Bash(git push:*),Bash(git rebase:*),Bash(git reset:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr comment:*),Bash(gh api:*)"
          prompt: |
            Du bist der Builder im LeadPilot-Repository. Codex hat PR #${{ needs.gate.outputs.pr }}
            auf Head ${{ needs.gate.outputs.head_sha }} geprüft. Das ist die automatische Nacharbeitsrunde
            ${{ needs.gate.outputs.round }} von 3.

            1. Lies CLAUDE.md, AGENTS.md und den Detailauftrag dieses PR unter docs/auftraege/ (siehe PR-Text, `gh pr view`).
            2. Lies alle Befunde in .codex-review-cycle/findings.md. Diese Datei ist die einzige Befundquelle.
               Bearbeite alle Befunde gesammelt in diesem einen Lauf.
            3. Prüfe jeden Befund gegen Auftrag und Code. Behebe berechtigte Befunde. Einen unberechtigten
               Befund änderst du nicht, sondern begründest ihn.
            4. Ändere nur die Ziel-Dateien des Auftrags. Nicht ändern: src/simulation, src/types, src/context,
               src/services/data, src/features/resources, .github/ und .codex-review-cycle/ (außer summary.md).
               Braucht ein Befund eine Datei außerhalb dieser Grenzen oder widersprechen sich Anforderungen:
               nichts committen und in der Zusammenfassung an @mapoenisch melden.
            5. Vor dem Commit müssen grün sein: `npx tsc --noEmit`, `npm run lint`, `npm test`, `npm run verify`,
               `npm run build`. Ist ein Gate rot und du kannst es nicht beheben: nichts committen, an @mapoenisch melden.
            6. Trage am Ende von docs/BUILD_LOG.md einen Abschnitt „Automatische Nacharbeit Runde N“ ein:
               Befunde mit Datei, Entscheidung (behoben/begründet abgelehnt), Gates mit Ergebnis, leerer
               Schutzbereichs-Diff.
            7. Committe lokal mit einer deutschen Nachricht. Nicht pushen: Der Workflow prüft deine Commits
               und pusht sie selbst.
            8. Schreibe eine kurze Zusammenfassung nach .codex-review-cycle/summary.md: Runde, je Befund die
               Entscheidung, Gates. Der Workflow veröffentlicht sie als PR-Kommentar.

            Verboten: pushen, mergen, Reviews freigeben oder ablehnen, Review-Threads auflösen, Labels oder
            Rulesets ändern, Tags setzen, Branches löschen.

      - name: Ergebnis als Bundle weitergeben
        env:
          START_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          git branch -f codex-rework-result HEAD
          if [ "$(git rev-parse HEAD)" != "$START_SHA" ]; then
            git bundle create "$RUNNER_TEMP/result/rework.bundle" "$START_SHA..codex-rework-result"
          fi
          if [ -f .codex-review-cycle/summary.md ]; then
            cp .codex-review-cycle/summary.md "$RUNNER_TEMP/result/summary.md"
          else
            echo "Keine Zusammenfassung erzeugt." > "$RUNNER_TEMP/result/summary.md"
          fi

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: codex-rework-result
          path: ${{ runner.temp }}/result/
          retention-days: 7

  publish:
    needs: [gate, rework]
    if: needs.gate.outputs.action == 'rework'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Führt keinen PR-Code aus: nur Git-Prüfungen, Push und Kommentar.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: PR-Branch auschecken (ohne Ausführung von PR-Code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.head_ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codex-rework-result
          path: ${{ runner.temp }}/result

      - name: Commits prüfen und pushen
        id: push
        env:
          START_SHA: ${{ needs.gate.outputs.head_sha }}
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$START_SHA" || { echo "Branch hat sich seit dem Review bewegt"; exit 1; }
          bundle="$RUNNER_TEMP/result/rework.bundle"
          if [ ! -f "$bundle" ]; then
            echo "Keine Commits aus der Nacharbeit."; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git bundle verify "$bundle"
          git fetch "$bundle" codex-rework-result:codex-rework-result
          git merge-base --is-ancestor "$START_SHA" codex-rework-result || { echo "Kein Fast-Forward"; exit 1; }
          count="$(git rev-list --count "$START_SHA..codex-rework-result")"
          [ "$count" -le 20 ] || { echo "Zu viele Commits: $count"; exit 1; }
          changed="$(git diff --name-only "$START_SHA" codex-rework-result -- src/simulation src/types src/context src/services/data src/features/resources .github .codex-review-cycle)"
          if [ -n "$changed" ]; then
            echo "Schutzbereich, Workflow oder Arbeitsdatei geändert, Push blockiert:"; echo "$changed"; exit 1
          fi
          git push origin "codex-rework-result:refs/heads/$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "new_sha=$(git rev-parse codex-rework-result)" >> "$GITHUB_OUTPUT"

      - name: CI für den neuen Head starten
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
        # Pushes mit dem Job-Token lösen keine pull_request-Läufe aus; workflow_dispatch schon.
        run: gh workflow run ci.yml --ref "$HEAD_REF"

      # Der Push des Job-Tokens löst `codex-status.yml` nicht aus: den neuen Head ausdrücklich auf
      # `pending` setzen. Ist der Statusworkflow noch nicht auf dem Default-Branch, bleibt das folgenlos.
      - name: Codex-Status für den neuen Head starten
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ needs.gate.outputs.pr }}
        run: gh workflow run codex-status.yml --ref "$DEFAULT_BRANCH" -f pr="$PR" || echo "codex-status.yml nicht startbar (noch nicht auf dem Default-Branch?)"

      - name: Zusammenfassung veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          ROUND: ${{ needs.gate.outputs.round }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          NEW_SHA: ${{ steps.push.outputs.new_sha }}
        run: |
          # Inhalt stammt aus dem Job mit PR-Code: Markierungen und Claude-Auslöser entschärfen.
          sed -e 's/<!--/\&lt;!--/g' -e 's/@claude/claude/gI' "$RUNNER_TEMP/result/summary.md" | head -c 60000 > summary.md
          if [ "$PUSHED" = "true" ]; then status="Neuer Head \`$NEW_SHA\`."; else status="Keine Commits gepusht."; fi
          printf '**Automatische Nacharbeit Runde %s von 3.** %s\n\n' "$ROUND" "$status" | cat - summary.md > body.md
          # Codex prüft Pushes des Job-Tokens nicht von selbst und reagiert nicht auf Bot-Kommentare;
          # GitHub hält die PR-CI dieses Pushes zurück (Ende-zu-Ende-Test PR #43). Marc ist dran.
          if [ "$PUSHED" = "true" ]; then
            printf '\n\n---\n\n@mapoenisch Du bist dran, damit der Kreislauf weiterläuft:\n\n1. In diesem PR die zurückgehaltene CI mit **„Approve and run workflows“** freigeben (falls angezeigt).\n2. Einen Kommentar mit `@codex review` schreiben. Dann prüft Codex den Head `%s`, und bei neuen Befunden startet die nächste Runde automatisch.\n' "$NEW_SHA" >> body.md
          fi
          gh pr comment "$PR" --body-file body.md

  notify:
    needs: [gate, rework, publish]
    if: failure() && needs.gate.outputs.action == 'rework'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Marc bei Fehlschlag informieren
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr }}
          ROUND: ${{ needs.gate.outputs.round }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --repo "$REPO" --body "@mapoenisch Die automatische Nacharbeit Runde ${ROUND} von 3 ist fehlgeschlagen oder hat eine Schutzgrenze verletzt. Lauf: ${RUN_URL}. Bitte prüfen; die Runde zählt zum Limit."
