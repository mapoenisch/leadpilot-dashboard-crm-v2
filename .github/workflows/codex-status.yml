# Automatisierungs-Restpunkte (docs/auftraege/ANTIGRAVITY_AUFTRAG_CI_AUTOMATISIERUNG_RESTPUNKTE.md):
# Setzt den Commit-Status `codex-review` für den Head-SHA eines PR. Der Status zeigt serverseitig
# prüfbar, ob Codex zum aktuellen Stand Befunde meldet (failure), keine Befunde meldet (success)
# oder noch kein Ergebnis vorliegt (pending). Er ersetzt weder den Review noch die Freigabe durch Marc.
# Sicherheit: Alle Auslöser laufen mit dem Workflow vom Default-Branch; das Skript kommt ebenfalls
# vom Default-Branch, PR-Code wird nie ausgecheckt. Der Job darf nur Status schreiben.
name: Codex Status

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: codex-status-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  status:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.review.user.id == 199175422 &&
       github.event.review.user.type == 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       github.event.comment.user.id == 199175422 &&
       github.event.comment.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    steps:
      - name: Statuslogik vom Default-Branch laden
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .cycle-tools
          sparse-checkout: scripts/codexReviewCycle.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.18.0
      - name: Status codex-review setzen
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          tool=.cycle-tools/scripts/codexReviewCycle.mjs
          if [ ! -f "$tool" ]; then
            echo "Review-Zyklus ist noch nicht auf dem Default-Branch: übersprungen."
            exit 0
          fi
          if ! grep -q "runStatus" "$tool"; then
            echo "Statusbefehl ist noch nicht auf dem Default-Branch: übersprungen."
            exit 0
          fi
          case "$PR" in ''|*[!0-9]*) echo "PR-Nummer fehlt oder ist nicht numerisch"; exit 1 ;; esac
          node "$tool" status --pr="$PR"
